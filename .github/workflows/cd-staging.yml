name: Deploy to Staging
on:
  push:
    branches: [ develop ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STAGING_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.STAGING_HOST }}" >> ~/.ssh/known_hosts

      - name: Ensure docker on server
        run: |
          ssh ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }} '\
            if ! command -v docker >/dev/null; then curl -fsSL https://get.docker.com | sh; fi; \
            if ! docker compose version >/dev/null 2>&1; then \
              DOCKER_CONFIG=${HOME}/.docker \
              && sudo mkdir -p /usr/local/lib/docker/cli-plugins \
              && curl -SL https://github.com/docker/compose/releases/download/v2.29.7/docker-compose-linux-x86_64 -o /usr/local/lib/docker/cli-plugins/docker-compose \
              && sudo chmod +x /usr/local/lib/docker/cli-plugins/docker-compose; \
            fi \
          '

      - name: Ship deployment subset
        run: |
          ssh ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }} 'mkdir -p ~/commisio-deploy'
          rsync -az --delete \
            infra/compose/docker-compose.staging.yml \
            infra/compose/docker-compose.auto.yml \
            infra/nginx/nginx-app.conf \
            tools/entrypoint.sh \
            ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }}:~/commisio-deploy/

      - name: Provide env on server
        run: |
          ssh ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }} "\
            mkdir -p ~/commisio-deploy/env && \
            echo \"\${{ secrets.STAGING_ENV_B64 }}\" | base64 -d > ~/commisio-deploy/env/.env.staging \
          "

      # لو حابب تسحب صور من GHCR بدل البناء على السيرفر (اختياري):
      # - name: GHCR login on server
      #   if: ${{ secrets.GHCR_PAT && secrets.GHCR_USER }}
      #   run: |
      #     ssh ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }} "\
      #       echo \"${{ secrets.GHCR_PAT }}\" | docker login ghcr.io -u \"${{ secrets.GHCR_USER }}\" --password-stdin \
      #     "

      - name: Compose up (build+run) on server
        run: |
          ssh ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }} "\
            cd ~/commisio-deploy && \
            docker compose -f infra/compose/docker-compose.staging.yml -f infra/compose/docker-compose.auto.yml up -d --build \
          "

      - name: Health check
        run: |
          # backend listens 8000 internally; Nginx reverse-proxy should expose 443 if TLS جاهز
          ssh ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }} "\
            docker ps && docker compose -f ~/commisio-deploy/infra/compose/docker-compose.staging.yml -f ~/commisio-deploy/infra/compose/docker-compose.auto.yml ps \
          "
