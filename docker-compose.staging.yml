version: "3.9"
name: shoobydo-staging
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER:-app}
      POSTGRES_PASSWORD: ${DB_PASS:-app}
      POSTGRES_DB: ${DB_NAME:-appdb}
    volumes: [ "pgdata_staging:/var/lib/postgresql/data" ]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ${DB_USER:-app} -d ${DB_NAME:-appdb}"]
      interval: 10s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    command: ["redis-server","--save","","--appendonly","no"]
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 5s
      timeout: 3s
      retries: 30
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: [.env.staging]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://${DB_USER:-app}:${DB_PASS:-app}@db:5432/${DB_NAME:-appdb}}
    ports: ["8802:8001"]    # خارجي 8802 ← داخلي 8001 (تفادي التعارض)
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD","curl","-sfL","http://localhost:8001/health"]
      interval: 5s
      timeout: 3s
      retries: 60
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    env_file: [.env.staging]
    environment:
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE}
    ports: ["8800:3000"]    # خارجي 8800 ← داخلي 3000
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD","curl","-sfL","http://localhost:3000"]
      interval: 5s
      timeout: 3s
      retries: 60
volumes:
  pgdata_staging:
